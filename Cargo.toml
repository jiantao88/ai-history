[package]
name = "ai-history"
version = "0.2.0"
edition = "2021"
description = "Search and export AI coding assistant chat history"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.14"
memmap2 = "0.9"
memchr = "2.7"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
owo-colors = "4"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
